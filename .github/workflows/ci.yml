# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: CI - tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Checar sintaxe (py_compile)
        run: python -m py_compile agent.py app.py

      - name: Lint (ruff)
        run: |
          pip install ruff
          ruff check agent.py app.py

  test-unit:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Testes unitários (somar, executar_ferramenta, carregar_contexto)
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          echo "Rodando testes unitários (marker: unitario)..."
          pytest -m unitario -vv -s

  test-contrato:
    needs: test-unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Testes de contrato (FERRAMENTAS vs. código Python)
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          echo "Rodando testes de contrato (marker: contrato)..."
          pytest -m contrato -vv -s
  
  test-smoke:
    needs: test-contrato
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Testes de contrato (FERRAMENTAS vs. código Python)
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          echo "Rodando testes de contrato (marker: contrato)..."
          pytest -m smoke -vv -s

  test-run-level:
    needs: test-smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Testes run-level (responder(), cliente da OpenAI dublado)
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          echo "Rodando testes run-level (marker: run_level)..."
          pytest -m run_level -vv -s
          
  test-eval:
    needs: test-run-level
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Eval de persona (Ada, Val, Lint — chama a API real)
        env:
          PYTHONUNBUFFERED: "1"
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          echo "Rodando eval de persona (marker: eval)..."
          pytest -m eval -vv -s
